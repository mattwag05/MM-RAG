# Raspberry Pi / tailnet deploy. Public agent transport is MCP HTTP on 8766.
# REST is intentionally not published here; keep it for local admin/debug.
x-mmrag-pi-env: &mmrag-pi-env
  MMRAG_DATA_DIR: /data
  MMRAG_INGEST_INLINE: "false"
  MMRAG_WORKER_CONCURRENCY: "1"
  MMRAG_QUERY_VECTOR_ENABLED: "false"
  MMRAG_MCP_HOST: 0.0.0.0
  MMRAG_MCP_PORT: "8766"
  MMRAG_MCP_PATH: ${MMRAG_MCP_PATH:-/mcp}
  MMRAG_MCP_PUBLIC_URL: ${MMRAG_MCP_PUBLIC_URL:-http://127.0.0.1:8766}
  MMRAG_MCP_TOKEN: ${MMRAG_MCP_TOKEN:?MMRAG_MCP_TOKEN is required for Pi/tailnet MCP}
  MMRAG_OLLAMA_URL: ${MMRAG_OLLAMA_URL:-http://127.0.0.1:11434}
  MMRAG_LOG_LEVEL: ${MMRAG_LOG_LEVEL:-INFO}

services:
  mmrag-init:
    image: mmrag:0.1.0
    build: .
    restart: "no"
    command: ["mmrag", "init-db"]
    volumes:
      - mmrag-data:/data
    environment:
      <<: *mmrag-pi-env

  mmrag-mcp:
    image: mmrag:0.1.0
    build: .
    restart: unless-stopped
    depends_on:
      mmrag-init:
        condition: service_completed_successfully
    command: ["mmrag", "serve-mcp-http"]
    ports:
      - "${MMRAG_PUBLISH_HOST:-127.0.0.1}:8766:8766"
    volumes:
      - mmrag-data:/data
    environment:
      <<: *mmrag-pi-env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/.well-known/mcp-resource', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mmrag-worker:
    image: mmrag:0.1.0
    build: .
    restart: unless-stopped
    depends_on:
      mmrag-init:
        condition: service_completed_successfully
    command: ["mmrag", "worker"]
    volumes:
      - mmrag-data:/data
    environment:
      <<: *mmrag-pi-env
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import sys; cmd=Path('/proc/1/cmdline').read_bytes(); sys.exit(0 if b'mmrag\\x00worker' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mmrag-data:
